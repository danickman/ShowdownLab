          node -e "const fs=require('fs');new Function(require('./tools/qa/fast300-worker-raster-candidate.cjs')(fs.readFileSync('v3/v3.js','utf8')))"
      - name: Confirm original and exact combined 300 physical simulation state parity
        run: node tools/qa/check-fast300-physical-combined-exact.cjs
      - name: Install pinned Chromium browser dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: bash tools/qa/install-browser-deps.sh
      - name: Prepare verified Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Original 300 versus exact Worker at .75 1x with original 10x, screenshots and full FX
