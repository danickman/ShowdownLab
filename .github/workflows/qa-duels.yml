name: Duel and combat regression
on:
  push:
    branches: [qa-turn1-duel-baseline]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
# Only the newest QA push per ref needs expensive stress/browser jobs.
# Protect PR runs on distinct refs; cancel superseded work without weakening tests.
concurrency:
  group: showdown-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  root-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical root-only entry and pinned integrity
        run: |
          test -f index.html
          test ! -e v3/index.html
          node tools/qa/release-hashes.cjs --verify
          node tools/qa/check-turn3-consistency.cjs
      - name: Validate iPhone 14 Pro Max primary device and portrait QA contract
        run: node tools/qa/check-primary-device-contract.cjs
      - name: Verify offline precache graph and rollback
        run: node tools/qa/check-release4c.cjs
      - name: Verify Home art streaming
        run: node tools/qa/check-streaming.cjs
      - name: Verify launch guide and PWA hooks
        run: node tools/check-launch-guide.cjs
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned SHA256 release manifest
        run: node tools/qa/release-hashes.cjs --verify
      - name: Validate iPhone 14 Pro Max primary device and portrait QA contract
        run: node tools/qa/check-primary-device-contract.cjs
      - name: Ordered 300-duel sweep
        env:
          QA_RECEIPT: duel-receipt.json
          QA_SHA: ${{ github.sha }}
        run: node tools/qa/check-duels.cjs
      - name: Turn 5C paired 80 and 120 fighter deterministic stress
        env:
          QA_STRESS_RECEIPT: stress5c-receipt.json
        run: node tools/qa/check-stress5c.cjs
      - name: Turn 5D staging geometry and performance parity
        env:
          QA_STAGING_RECEIPT: staging5d-receipt.json
        run: node tools/qa/check-staging5d.cjs
      - name: Turn 5E 61 to 160 fighter dense staging visual bounds
        env:
          QA_DENSE_RECEIPT: dense5e-receipt.json
        run: node tools/qa/check-dense5e.cjs
      - name: Turn 5F staging lookup caching parity
        env:
          QA_STAGING5F_RECEIPT: staging5f-receipt.json
        run: node tools/qa/check-staging5f.cjs
      - name: Turn 5G dense depth ordering
        run: node tools/qa/check-depth5g.cjs
      - name: Existing evolution and deterministic checks
        if: success()
        run: node tools/check-evolution-progression.cjs
      - name: Turn 3 Guide mastery and touch consistency
        if: success()
        run: node tools/qa/check-turn3-consistency.cjs
      - name: Turn 4A prioritized sprite loading
        run: node tools/qa/check-streaming.cjs
      - name: Turn 4C atomic release and offline tests
        run: node tools/qa/check-release4c.cjs
      - name: Legacy launch guide and SW compatibility
        run: node tools/check-launch-guide.cjs
      - name: Existing Ultimate ability checks
        if: success()
        run: node tools/check-ultimate-abilities.cjs
      - name: Upload duel receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-receipt
          path: |
            duel-receipt.json
            stress5c-receipt.json
            staging5d-receipt.json
            dense5e-receipt.json
            staging5f-receipt.json
          if-no-files-found: warn

  exploratory-formations:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run optional staging and formation experiments
        run: |
          node tools/qa/check-composition5h.cjs
          node tools/qa/check-staging5h-candidate.cjs
          node tools/qa/check-formation-density.cjs
          node tools/qa/check-formation-variants.cjs
          node tools/qa/check-formation-spacing.cjs
          node tools/qa/check-horizontal-formation.cjs
          node tools/qa/check-engagement-zones.cjs
          node tools/qa/check-zone-engagement.cjs
          node tools/qa/check-zone-locality.cjs
          node tools/qa/check-zone-terminal.cjs
          node tools/qa/check-zone-mirrors.cjs

  population-and-disruption:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate draft source and QA syntax
        run: |
          node --check v3/evolution-rules.js
          node --check v3/simulation-adapter.js
          node --check v3/round-loop.js
          node --check tools/qa/check-population-draft.cjs
          node --check tools/qa/check-lab-enemy-batch.cjs
      - name: Verify projected cap and one-round nonpermanent sabotage
        run: node tools/qa/check-population-draft.cjs
      - name: Verify round winner, losing-side lives and mirrored match results
        run: node tools/qa/check-round-winner-lives.cjs
      - name: Verify Lab batch enemy types, single counts and cap
        run: node tools/qa/check-lab-enemy-batch.cjs
