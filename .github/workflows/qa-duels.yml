          QA_FAST300_WORKER_RASTER_OUTPUT: ${{ runner.temp }}/fast300-worker-raster
        run: node tools/qa/check-fast300-worker-raster-browser.cjs
      - name: Save genuine 300 RAF physics throughput and full viewport images
        if: always()
