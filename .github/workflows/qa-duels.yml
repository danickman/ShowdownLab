name: Duel and combat regression
on:
  # Test QA changes once via the open PR rather than twice on push and PR.
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
# Only the newest QA push per ref needs expensive stress/browser jobs.
# Protect PR runs on distinct refs; cancel superseded work without weakening tests.
concurrency:
  group: showdown-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  root-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical root-only entry and pinned integrity
        run: |
          test -f index.html
          test ! -e v3/index.html
          node tools/qa/release-hashes.cjs --verify
          node tools/qa/check-turn3-consistency.cjs
      - name: Validate iPhone 14 Pro Max primary device and portrait QA contract
        run: node tools/qa/check-primary-device-contract.cjs
      - name: Verify offline precache graph and rollback
        run: node tools/qa/check-release4c.cjs
      - name: Turn16 historical Beetank source plus Turn17 playable Anvil exact contract
        run: |
          node --check v3/ultimate-abilities.js
          node tools/qa/check-beetank-fracture-playable-turn16.cjs
          node --check tools/qa/check-beetank-anvil-playable-turn17.cjs
          node tools/qa/check-beetank-anvil-playable-turn17.cjs
      - name: Verify Home art streaming
        run: node tools/qa/check-streaming.cjs
      - name: Verify launch guide and PWA hooks
        run: node tools/check-launch-guide.cjs
      - name: Turn 10 visible Mole rupture, persistent scar and crowd-safe sunny sky
        run: |
          node --check v3/ultimate-effects.js
          node --check v3/arena-ambience.js
          node --check v3/v3.js
          node tools/qa/check-mole-rift-spectacle.cjs
          node tools/qa/check-turn10-theatre.cjs
      - name: Turn 11 source-cached sky and crystal/solar floor integrity
        run: |
          node --check v3/arena-art.js
          node --check v3/arena-stage.js
          node --check tools/qa/check-turn11-arena.cjs
          node tools/qa/check-turn11-arena.cjs
  goblin-l5-relay-roi-turn12:
    # Completed rejected experiment; manual research only to conserve CI.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source-only L5 Goblin pack timing candidate
        run: node --check tools/qa/check-goblin-l5-relay-roi-turn12.cjs
      - name: Match real 20/40 terminal ROI, peer, numeric counters, true fronts and RAF
        env:
          QA_GOBLIN_RELAY_RECEIPT: goblin-l5-relay-turn12.json
        run: node tools/qa/check-goblin-l5-relay-roi-turn12.cjs
      - name: Preserve physical matched source-only research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goblin-l5-relay-turn12
          path: goblin-l5-relay-turn12.json
          if-no-files-found: warn

