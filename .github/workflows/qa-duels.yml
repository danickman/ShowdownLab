name: Duel and combat regression
on:
  push:
    branches: [qa-turn1-duel-baseline]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned SHA256 release manifest
        run: node tools/qa/release-hashes.cjs --verify
      - name: Ordered 300-duel sweep
        env:
          QA_RECEIPT: duel-receipt.json
          QA_SHA: ${{ github.sha }}
        run: node tools/qa/check-duels.cjs
      - name: Turn 5C paired 80 and 120 fighter deterministic stress
        env:
          QA_STRESS_RECEIPT: stress5c-receipt.json
        run: node tools/qa/check-stress5c.cjs
      - name: Turn 5D staging geometry and performance parity
        env:
          QA_STAGING_RECEIPT: staging5d-receipt.json
        run: node tools/qa/check-staging5d.cjs
      - name: Turn 5E 61 to 160 fighter dense staging visual bounds
        env:
          QA_DENSE_RECEIPT: dense5e-receipt.json
        run: node tools/qa/check-dense5e.cjs
      - name: Turn 5F staging lookup caching parity
        env:
          QA_STAGING5F_RECEIPT: staging5f-receipt.json
        run: node tools/qa/check-staging5f.cjs
      - name: Turn 5G dense depth ordering
        run: node tools/qa/check-depth5g.cjs
      - name: Turn 5H matched camera composition A/B diagnostic
        env:
          QA_COMPOSITION_RECEIPT: composition5h-receipt.json
        run: node tools/qa/check-composition5h.cjs
      - name: Turn 5H expanded staging experiment
        env:
          QA_STAGE_CANDIDATE_RECEIPT: staging5h-candidate.json
        run: node tools/qa/check-staging5h-candidate.cjs
      - name: Formation density across actual simulation phases
        env:
          QA_FORMATION_RECEIPT: formation-density.json
        run: node tools/qa/check-formation-density.cjs
      - name: Isolated deployment lane variants
        env:
          QA_LANES_RECEIPT: formation-variants.json
        run: node tools/qa/check-formation-variants.cjs
      - name: Vertical and depth formation variants
        env:
          QA_LANES_RECEIPT: formation-spacing.json
        run: node tools/qa/check-formation-spacing.cjs
      - name: Horizontal formation alternatives
        env:
          QA_LANES_RECEIPT: horizontal-formation.json
        run: node tools/qa/check-horizontal-formation.cjs
      - name: Three-zone distributed engagement prototype
        env:
          QA_LANES_RECEIPT: engagement-zones.json
        run: node tools/qa/check-engagement-zones.cjs
      - name: Zone engagement persistence and damage timing
        env:
          QA_LANES_RECEIPT: zone-engagement.json
        run: node tools/qa/check-zone-engagement.cjs
      - name: Locality-aware target selection experiment
        env:
          QA_LANES_RECEIPT: zone-locality.json
        run: node tools/qa/check-zone-locality.cjs
      - name: Bounded locality full-match comparison
        env:
          QA_LANES_RECEIPT: zone-terminal.json
        run: node tools/qa/check-zone-terminal.cjs
      - name: Mirrored full-match locality candidates
        env:
          QA_LANES_RECEIPT: zone-mirrors.json
        run: node tools/qa/check-zone-mirrors.cjs
      - name: Existing evolution and deterministic checks
        if: success()
        run: node tools/check-evolution-progression.cjs
      - name: Turn 3 Guide mastery and touch consistency
        if: success()
        run: node tools/qa/check-turn3-consistency.cjs
      - name: Turn 4A prioritized sprite loading
        run: node tools/qa/check-streaming.cjs
      - name: Turn 4C atomic release and offline tests
        run: node tools/qa/check-release4c.cjs
      - name: Legacy launch guide and SW compatibility
        run: node tools/check-launch-guide.cjs
      - name: Existing Ultimate ability checks
        if: success()
        run: node tools/check-ultimate-abilities.cjs
      - name: Upload duel receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-receipt
          path: |
            duel-receipt.json
            stress5c-receipt.json
            staging5d-receipt.json
            dense5e-receipt.json
            staging5f-receipt.json
            composition5h-receipt.json
            staging5h-candidate.json
            formation-density.json
            formation-variants.json
            formation-spacing.json
            horizontal-formation.json
            engagement-zones.json
            zone-engagement.json
            zone-locality.json
            zone-terminal.json
            zone-mirrors.json
          if-no-files-found: warn

  browser-turn3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runtime
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --prefix tools/qa --no-audit --no-fund
      - name: Verify packaged Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Browser QA for Dragon and touch
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_BROWSER_OUTPUT: ${{ runner.temp }}/turn3-browser
        run: node tools/qa/check-turn3-browser.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turn3-browser
          path: ${{ runner.temp }}/turn3-browser
          if-no-files-found: warn

  browser-composition5h:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --prefix tools/qa --no-audit --no-fund
      - name: Prepare Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Capture exact formation snapshots
        env:
          QA_LANES_RECEIPT: ${{ runner.temp }}/turn5h-browser/formation-exact.json
        run: |
          mkdir -p "${{ runner.temp }}/turn5h-browser"
          node tools/qa/check-formation-visual-snapshots.cjs
      - name: Capture exact tri-zone combat snapshots
        env:
          QA_LANES_RECEIPT: ${{ runner.temp }}/turn5h-browser/zones-exact.json
        run: node tools/qa/check-zones-visual-snapshots.cjs
      - name: Matched authored sprite camera screenshots
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_VISUAL_OUTPUT: ${{ runner.temp }}/turn5h-browser
        run: node tools/qa/check-composition5h-browser.cjs
      - name: Upload A/B sprite contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turn5h-composition
          path: ${{ runner.temp }}/turn5h-browser
          if-no-files-found: warn

  browser-turn4d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --prefix tools/qa --no-audit --no-fund
      - name: Prepare Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Cold warm and offline service worker QA
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_BROWSER_OUTPUT: ${{ runner.temp }}/turn4d-browser
        run: node tools/qa/check-turn4d-browser.cjs
      - name: Upload real browser network receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turn4d-browser
          path: ${{ runner.temp }}/turn4d-browser
          if-no-files-found: warn

  browser-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --prefix tools/qa --no-audit --no-fund
      - name: Prepare Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Interrupted upgrade and offline recovery
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_UPGRADE_OUTPUT: ${{ runner.temp }}/upgrade-browser
        run: node tools/qa/check-upgrade-browser.cjs
      - name: Upload failed-upgrade recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-browser
          path: ${{ runner.temp }}/upgrade-browser
          if-no-files-found: warn

  knight-art-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Generate six larger Base Knight pose candidates
        run: python tools/rebuild-base-knight.py --dest tools/qa/knight-candidate
      - name: Upload proposed Knight assets and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knight-base-256-candidate
          path: tools/qa/knight-candidate
          if-no-files-found: error
