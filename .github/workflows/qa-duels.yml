name: Duel and combat regression
on:
  push:
    branches: [qa-turn1-duel-baseline]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  root-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical root-only entry and pinned integrity
        run: |
          test -f index.html
          test ! -e v3/index.html
          node tools/qa/release-hashes.cjs --verify
          node tools/qa/check-turn3-consistency.cjs
      - name: Verify offline precache graph and rollback
        run: node tools/qa/check-release4c.cjs
      - name: Verify Home art streaming
        run: node tools/qa/check-streaming.cjs
      - name: Verify launch guide and PWA hooks
        run: node tools/check-launch-guide.cjs
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned SHA256 release manifest
        run: node tools/qa/release-hashes.cjs --verify
      - name: Ordered 300-duel sweep
        env:
          QA_RECEIPT: duel-receipt.json
          QA_SHA: ${{ github.sha }}
        run: node tools/qa/check-duels.cjs
      - name: Turn 5C paired 80 and 120 fighter deterministic stress
        env:
          QA_STRESS_RECEIPT: stress5c-receipt.json
        run: node tools/qa/check-stress5c.cjs
      - name: Turn 5D staging geometry and performance parity
        env:
          QA_STAGING_RECEIPT: staging5d-receipt.json
        run: node tools/qa/check-staging5d.cjs
      - name: Turn 5E 61 to 160 fighter dense staging visual bounds
        env:
          QA_DENSE_RECEIPT: dense5e-receipt.json
        run: node tools/qa/check-dense5e.cjs
      - name: Turn 5F staging lookup caching parity
        env:
          QA_STAGING5F_RECEIPT: staging5f-receipt.json
        run: node tools/qa/check-staging5f.cjs
      - name: Turn 5G dense depth ordering
        run: node tools/qa/check-depth5g.cjs
      - name: Existing evolution and deterministic checks
        if: success()
        run: node tools/check-evolution-progression.cjs
      - name: Turn 3 Guide mastery and touch consistency
        if: success()
        run: node tools/qa/check-turn3-consistency.cjs
      - name: Turn 4A prioritized sprite loading
        run: node tools/qa/check-streaming.cjs
      - name: Turn 4C atomic release and offline tests
        run: node tools/qa/check-release4c.cjs
      - name: Legacy launch guide and SW compatibility
        run: node tools/check-launch-guide.cjs
      - name: Existing Ultimate ability checks
        if: success()
        run: node tools/check-ultimate-abilities.cjs
      - name: Upload duel receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-receipt
          path: |
            duel-receipt.json
            stress5c-receipt.json
            staging5d-receipt.json
            dense5e-receipt.json
            staging5f-receipt.json
          if-no-files-found: warn

  exploratory-formations:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run optional staging and formation experiments
        run: |
          node tools/qa/check-composition5h.cjs
          node tools/qa/check-staging5h-candidate.cjs
          node tools/qa/check-formation-density.cjs
          node tools/qa/check-formation-variants.cjs
          node tools/qa/check-formation-spacing.cjs
          node tools/qa/check-horizontal-formation.cjs
          node tools/qa/check-engagement-zones.cjs
          node tools/qa/check-zone-engagement.cjs
          node tools/qa/check-zone-locality.cjs
          node tools/qa/check-zone-terminal.cjs
          node tools/qa/check-zone-mirrors.cjs

  population-and-disruption:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate draft source and QA syntax
        run: |
          node --check v3/evolution-rules.js
          node --check v3/simulation-adapter.js
          node --check v3/round-loop.js
          node --check tools/qa/check-population-draft.cjs
      - name: Verify projected cap and one-round nonpermanent sabotage
        run: node tools/qa/check-population-draft.cjs
      - name: Verify round winner, losing-side lives and mirrored match results
        run: node tools/qa/check-round-winner-lives.cjs
  extreme-300-fighters:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 300 fighter edge harness
        run: node --check tools/qa/check-300-population.cjs
      - name: Run 300 fighter 1x and 10x extreme stress
        env:
          QA_300_RECEIPT: extreme-300-receipt.json
        run: node tools/qa/check-300-population.cjs
      - name: Upload 300 fighter performance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extreme-300-receipt
          path: extreme-300-receipt.json
          if-no-files-found: warn

  threat-observer-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pure observer and QA syntax
        run: |
          node --check tools/qa/threat-observer.cjs
          node --check tools/qa/check-threat-observer.cjs
      - name: Verify Sniper and Goblin decisions plus deterministic combat parity
        env:
          QA_THREAT_SIZES: '40,80,120'
          QA_THREAT_SEEDS: '1337'
          QA_THREAT_RECEIPT: threat-observer-receipt.json
        run: node tools/qa/check-threat-observer.cjs
      - name: Upload read-only observer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threat-observer-receipt
          path: threat-observer-receipt.json
          if-no-files-found: warn

  effective-engagement-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check effective engagement measurement syntax
        run: node --check tools/qa/check-effective-engagement.cjs
      - name: Observe real hit, ranged threat and pursuit without combat intervention
        env:
          QA_EFFECTIVE_COUNTS: '40,80,120,180,300'
          QA_EFFECTIVE_RECEIPT: effective-engagement-receipt.json
        run: node tools/qa/check-effective-engagement.cjs
      - name: Upload engagement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effective-engagement-receipt
          path: effective-engagement-receipt.json
          if-no-files-found: warn

  engagement-director-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated director research harness
        run: node --check tools/qa/check-engagement-director.cjs
      - name: Test real mixed-role combat without runtime modifications
        env:
          QA_ENGAGEMENT_COUNTS: '40,80'
          QA_ENGAGEMENT_SEEDS: '1337'
          QA_ENGAGEMENT_RECEIPT: engagement-director-spike.json
        run: node tools/qa/check-engagement-director.cjs
      - name: Save experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engagement-director-spike
          path: engagement-director-spike.json
          if-no-files-found: warn

  wider-front-fast-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate six-variant battle test syntax
        run: node --check tools/qa/check-zone-damage.cjs
      - name: Single-seed early formation signal
        env:
          QA_DAMAGE_SEEDS: '1337'
        run: node tools/qa/check-zone-damage.cjs

  damage-attribution-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate damage attribution syntax
        run: node --check tools/qa/check-zone-damage.cjs
      - name: Paired attributed damage smoke test
        env:
          QA_DAMAGE_SEEDS: '1337,7301,8675309'
          QA_LANES_RECEIPT: zone-damage-smoke.json
        run: node tools/qa/check-zone-damage.cjs
      - name: Upload attributed damage smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zone-damage-smoke
          path: zone-damage-smoke.json
          if-no-files-found: warn

  browser-turn3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runtime
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --prefix tools/qa --no-audit --no-fund
      - name: Verify packaged Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Browser QA for Dragon and touch
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_BROWSER_OUTPUT: ${{ runner.temp }}/turn3-browser
        run: node tools/qa/check-turn3-browser.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turn3-browser
          path: ${{ runner.temp }}/turn3-browser
          if-no-files-found: warn

  browser-composition5h:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --prefix tools/qa --no-audit --no-fund
      - name: Prepare Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Capture exact formation snapshots
        env:
          QA_LANES_RECEIPT: ${{ runner.temp }}/turn5h-browser/formation-exact.json
        run: |
          mkdir -p "${{ runner.temp }}/turn5h-browser"
          node tools/qa/check-formation-visual-snapshots.cjs
      - name: Capture exact tri-zone combat snapshots
        env:
          QA_LANES_RECEIPT: ${{ runner.temp }}/turn5h-browser/zones-exact.json
        run: node tools/qa/check-zones-visual-snapshots.cjs
      - name: Matched authored sprite camera screenshots
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_VISUAL_OUTPUT: ${{ runner.temp }}/turn5h-browser
        run: node tools/qa/check-composition5h-browser.cjs
      - name: Ultimate Lab enemy picker browser QA
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
        run: node tools/qa/check-lab-enemies-browser.cjs
      - name: Upload A/B sprite contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turn5h-composition
          path: ${{ runner.temp }}/turn5h-browser
          if-no-files-found: warn

  browser-turn4d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --prefix tools/qa --no-audit --no-fund
      - name: Prepare Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Cold warm and offline service worker QA
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_BROWSER_OUTPUT: ${{ runner.temp }}/turn4d-browser
        run: node tools/qa/check-turn4d-browser.cjs
      - name: Upload real browser network receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turn4d-browser
          path: ${{ runner.temp }}/turn4d-browser
          if-no-files-found: warn

  browser-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm install --prefix tools/qa --no-audit --no-fund
      - name: Prepare Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Interrupted upgrade and offline recovery
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_UPGRADE_OUTPUT: ${{ runner.temp }}/upgrade-browser
        run: node tools/qa/check-upgrade-browser.cjs
      - name: Upload failed-upgrade recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-browser
          path: ${{ runner.temp }}/upgrade-browser
          if-no-files-found: warn

  knight-art-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Generate six larger Base Knight pose candidates
        run: python tools/rebuild-base-knight.py --dest tools/qa/knight-candidate
      - name: Upload proposed Knight assets and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knight-base-256-candidate
          path: tools/qa/knight-candidate
          if-no-files-found: error
