          node -e "const fs=require('fs');new Function(require('./tools/qa/fast300-worker-raster70-candidate.cjs')(fs.readFileSync('v3/v3.js','utf8')))"
      - name: Source full-RAF all-population exact physical combat parity
        run: node tools/qa/check-fast300-physical-combined-exact.cjs
      - name: Install browser dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: bash tools/qa/install-browser-deps.sh
      - name: Prepare verified real Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Real 300 all FX at 1x and 10x with two matched seeds and paused-art PNG
