name: Duel and combat regression
on:
  # Test QA changes once via the open PR rather than twice on push and PR.
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
# Only the newest QA push per ref needs expensive stress/browser jobs.
# Protect PR runs on distinct refs; cancel superseded work without weakening tests.
concurrency:
  group: showdown-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  raf-clock-worker-research:
    # Archived rejected browser trial. Run only on manual dispatch.
    # One-shot Chromium report is captured in RAF_CLOCK_WORKER_300_2026-10-22.md.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check research worker and bridge syntax
        run: |
          node --check tools/qa/turn20-raf-clock-worker.js
          node --check tools/qa/turn20-raf-clock-bridge.js
          node --check tools/qa/check-turn20-raf-clock-worker-browser.cjs
      - name: Install pinned browser dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: bash tools/qa/install-browser-deps.sh
      - name: Prepare verified Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Real 300 1x and 10x Worker vs inline RAF plus 80 120 controls
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_RAFCLOCK_WORKER_OUTPUT: ${{ runner.temp }}/raf-clock-worker
        run: node tools/qa/check-turn20-raf-clock-worker-browser.cjs
      - name: Save real-frame and actual positive HP tick-rate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raf-clock-worker-study
          path: ${{ runner.temp }}/raf-clock-worker/turn20-raf-clock-worker.json
          if-no-files-found: warn
  fast300-collision-candidate-study:
    # Final Chromium A/B rejected; manual archive only, avoid extra QA credits.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source candidate and genuine full-RAF parity tool
        run: |
          node --check tools/qa/fast300-candidate.cjs
          node --check tools/qa/check-fast300-exact.cjs
          node --check tools/qa/check-fast300-browser.cjs
      - name: Compare genuine 20/40/80/120/300 source engine frames and six heldout 300 cases
        env:
          QA_TURN19_RECEIPT: ${{ runner.temp }}/fast300-exact.json
        run: node tools/qa/check-fast300-exact.cjs
      - name: Install real Chromium browser dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: bash tools/qa/install-browser-deps.sh
      - name: Prepare verified Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Alternating-order real 430 DPR3 300-fighter Chromium A/B 1x and 10x
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_FAST300_BROWSER_OUTPUT: ${{ runner.temp }}/fast300-browser
        run: node tools/qa/check-fast300-browser.cjs
      - name: Upload exact-physical-state and real browser measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast300-latency-research
          path: |
            ${{ runner.temp }}/fast300-exact.json
            ${{ runner.temp }}/fast300-browser/fast300-browser-study.json
          if-no-files-found: warn
  fast300-ink-mask-one-shot:
    # Actual 300-frame native-mask candidate inactive in production art; archived rejected trial.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and real source signature
        run: |
          node --check tools/qa/fast300-ink-candidate.cjs
          node --check tools/qa/check-fast300-ink-browser.cjs
          node -e "const fs=require('fs');new Function(require('./tools/qa/fast300-ink-candidate.cjs')(fs.readFileSync('v3/asset-renderer.js','utf8')))"
      - name: Install pinned Chromium dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: bash tools/qa/install-browser-deps.sh
      - name: Prepare real Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Real 300 fighters, full FX, alternating original vs prefiltered masks 1x and 10x
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_FAST300_INK_OUTPUT: ${{ runner.temp }}/fast300-ink
        run: node tools/qa/check-fast300-ink-browser.cjs
      - name: Save actual Chromium RAF and true physics results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast300-ink-raster-research
          path: ${{ runner.temp }}/fast300-ink/fast300-ink-study.json
          if-no-files-found: warn
  fast300-bitmap-one-shot:
    # Archived negative actual-Chromium receipt; do not run on ordinary PR changes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real source candidate and test
        run: |
          node --check tools/qa/fast300-bitmap-candidate.cjs
          node --check tools/qa/check-fast300-bitmap-browser.cjs
          node -e "const fs=require('fs');new Function(require('./tools/qa/fast300-bitmap-candidate.cjs')(fs.readFileSync('v3/asset-renderer.js','utf8')))"
      - name: Install pinned Chromium dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: bash tools/qa/install-browser-deps.sh
      - name: Prepare verified Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Full 300 authored fighters active HP and FX original versus shared-raster source at 1x and 10x
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_FAST300_BITMAP_OUTPUT: ${{ runner.temp }}/fast300-bitmap
        run: node tools/qa/check-fast300-bitmap-browser.cjs
      - name: Save uncensored browser intervals and real physics throughput
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast300-bitmap-study
          path: ${{ runner.temp }}/fast300-bitmap/fast300-bitmap-study.json
          if-no-files-found: warn
  fast300-physical-grid-one-shot:
    # Archived rejected current-raster physical grid A/B; manual dispatch only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify combined physics source and test syntax
        run: |
          node --check tools/qa/fast300-physical-combined-candidate.cjs
          node --check tools/qa/check-fast300-physical-combined-exact.cjs
          node --check tools/qa/check-fast300-physical-browser.cjs
          node -e "const fs=require('fs');new Function(require('./tools/qa/fast300-physical-combined-candidate.cjs')(fs.readFileSync('v3/legacy-sim-core.js','utf8')))"
      - name: Exact all-frame source SHA 20 40 80 120 300 both speeds and six holdouts
        env:
          QA_TURN19_RECEIPT: ${{ runner.temp }}/physical-combined-exact.json
        run: node tools/qa/check-fast300-physical-combined-exact.cjs
      - name: Install pinned Chromium browser dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: bash tools/qa/install-browser-deps.sh
      - name: Prepare verified Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Real active 300 full-FX rendered A/B at 1x and 10x
        env:
          NODE_PATH: tools/qa/node_modules
          QA_BROWSER_PATH: ${{ github.workspace }}/tools/qa/.runtime/chromium
          QA_FAST300_PHYSICAL_BROWSER_OUTPUT: ${{ runner.temp }}/fast300-physical
        run: node tools/qa/check-fast300-physical-browser.cjs
      - name: Archive exact state and measured browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast300-physical-combined-study
          path: |
            ${{ runner.temp }}/physical-combined-exact.json
            ${{ runner.temp }}/fast300-physical/fast300-physical-browser-study.json
          if-no-files-found: warn
  fast300-physical-worker-one-shot:
    # Historic Worker 300 real A/B rejected on 1x; manual archive.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source candidate and true threaded browser test
        run: |
          node --check tools/qa/fast300-physical-combined-candidate.cjs
          node --check tools/qa/check-fast300-physical-worker-browser.cjs
          node -e "const fs=require('fs');new Function(require('./tools/qa/fast300-physical-combined-candidate.cjs')(fs.readFileSync('v3/legacy-sim-core.js','utf8')))"
      - name: Reconfirm all physical states across 20 40 80 120 300 1x 10x
        run: node tools/qa/check-fast300-physical-combined-exact.cjs
      - name: Install pinned Chromium browser dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: bash tools/qa/install-browser-deps.sh
      - name: Prepare verified Chromium
        run: node tools/qa/setup-browser.cjs
      - name: Run full 300 Worker versus current baseline and 80 120 inline controls
        env:
