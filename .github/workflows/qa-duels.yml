          QA_FAST300_PHYSICAL_WORKER_OUTPUT: ${{ runner.temp }}/fast300-physical-worker
        run: node tools/qa/check-fast300-physical-worker-browser.cjs
      - name: Save native Chromium P95 actual HP and real worker ticks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast300-physical-worker-study
          path: ${{ runner.temp }}/fast300-physical-worker/fast300-physical-worker-study.json
