name: Focused fighter damage research
on:
  workflow_dispatch:
  push:
    branches: [qa-turn1-duel-baseline]
    paths:
      - 'tools/qa/check-zone-damage.cjs'
      - '.github/workflows/qa-zone-damage.yml'
permissions:
  contents: read
jobs:
  attributed-damage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check isolated attribution profiler
        run: node --check tools/qa/check-zone-damage.cjs
      - name: Attribute damage by fighter type across baseline and locality
        env:
          QA_LANES_RECEIPT: zone-damage.json
          QA_DAMAGE_SEEDS: '1337,7301,8675309'
        run: node tools/qa/check-zone-damage.cjs
      - name: Upload attributable damage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-zone-damage
          path: zone-damage.json
          if-no-files-found: warn
